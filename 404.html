<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,sans-serif;

background:#0F172A;

color:white;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

text-align:center;

padding:20px;

}

.container{

max-width:600px;

}

h1{

font-size:120px;

color:#3B82F6;

}

h2{

margin:20px 0;

font-size:34px;

}

p{

color:#cbd5e1;

margin-bottom:30px;

}

a{

display:inline-block;

padding:15px 35px;

background:#3B82F6;

color:white;

text-decoration:none;

border-radius:50px;

transition:.3s;

}

a:hover{

background:#2563EB;

}

</style>

</head>

<body>

<div class="container">

<h1>404</h1>

<h2>Oops! Page Not Found</h2>

<p>

The page you're looking for doesn't exist.

</p>

<a href="index.html">

Go Back Home

</a>

</div>

</body>

</html>
